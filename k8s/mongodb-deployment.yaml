apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb-deployment
  labels:
    app: smart-pharmacy
    tier: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smart-pharmacy
      tier: database
  template:
    metadata:
      labels:
        app: smart-pharmacy
        tier: database
    spec:
      containers:
        - name: mongodb
          image: mongo:7.0
          ports:
            - containerPort: 27017
              name: mongodb
          env:
            - name: MONGO_INITDB_DATABASE
              value: "smart_pharmacy"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: mongodb-persistent-storage
              mountPath: /data/db
      volumes:
        - name: mongodb-persistent-storage
          emptyDir: {} # Compatible with local Minikube / Docker Desktop without external CSI

