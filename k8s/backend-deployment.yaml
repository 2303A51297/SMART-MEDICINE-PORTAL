apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  labels:
    app: smart-pharmacy
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: smart-pharmacy
      tier: backend
  template:
    metadata:
      labels:
        app: smart-pharmacy
        tier: backend
    spec:
      containers:
        - name: backend
          image: smart-pharmacy-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http
          envFrom:
            - configMapRef:
                name: pharmacy-config
            - secretRef:
                name: pharmacy-secret
          resources:
            requests:
              cpu: "150m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10

