apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  labels:
    app: smart-pharmacy
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: smart-pharmacy
      tier: frontend
  template:
    metadata:
      labels:
        app: smart-pharmacy
        tier: frontend
    spec:
      containers:
        - name: frontend
          image: smart-pharmacy-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10

