version: '3.8'

services:
  # =========================================================
  # 1. MongoDB Database Container
  # =========================================================
  mongodb:
    image: mongo:7.0
    container_name: pharmacy_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: smart_pharmacy
    volumes:
      - mongo_data:/data/db
    networks:
      - pharmacy-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # =========================================================
  # 2. Node.js & Express REST API Backend
  # =========================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pharmacy_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/smart_pharmacy
      - JWT_SECRET=super_secret_pharmacy_jwt_key_2026_btech_devops
      - JWT_EXPIRE=30d
      - CLIENT_URL=http://localhost
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - uploads_data:/usr/src/app/uploads
    networks:
      - pharmacy-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # =========================================================
  # 3. React.js SPA Frontend (Nginx Production Server)
  # =========================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pharmacy_frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - pharmacy-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

# =========================================================
# Persistent Volumes & Network Topology
# =========================================================
volumes:
  mongo_data:
    driver: local
  uploads_data:
    driver: local

networks:
  pharmacy-network:
    driver: bridge

